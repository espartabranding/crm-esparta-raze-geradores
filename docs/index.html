<!DOCTYPE html>
<html lang="pt-BR">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de Ligação Raze Geradores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#14213D; --tinta-2:#55607A; --papel:#F4F5F9; --folha:#FFFFFF; --linha:#DFE2EC; --suave:#ECEEF5;
  --trilho:#101A33; --trilho-2:#8E9AB8; --trilho-linha:#243154; --trilho-ativo:#1E2C52; --trilho-faixa:#2B50FF; --trilho-borda:#34468A;
  --cobalto:#2B50FF; --marca:#FFE873; --verde:#12855F; --ambar:#B86E00; --vermelho:#C0392B; --cinza:#8A93A8;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --texto:"Montserrat","Segoe UI",system-ui,sans-serif;
  --fala:"Montserrat","Segoe UI",system-ui,sans-serif;
  --mono:"Montserrat","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --tinta:#E8EBF5; --tinta-2:#9AA4BF; --papel:#0D1426; --folha:#151E36; --linha:#26314F; --suave:#1B2540;
    --trilho:#080E1D; --trilho-linha:#1A2440; --trilho-ativo:#172244;
    --cobalto:#8FA4FF; --marca:#5A4A00; --verde:#3CC79A; --ambar:#F0B040; --vermelho:#F07E70; --cinza:#7C87A3; color-scheme:dark }
}
:root[data-theme="dark"]{ --tinta:#E8EBF5; --tinta-2:#9AA4BF; --papel:#0D1426; --folha:#151E36; --linha:#26314F; --suave:#1B2540;
    --trilho:#080E1D; --trilho-linha:#1A2440; --trilho-ativo:#172244;
    --cobalto:#8FA4FF; --marca:#5A4A00; --verde:#3CC79A; --ambar:#F0B040; --vermelho:#F07E70; --cinza:#7C87A3; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--papel); color:var(--tinta); font:400 15px/1.55 var(--texto)}
button,input,select{font:inherit; color:inherit}
a{color:var(--cobalto)}
:focus-visible{outline:2px solid var(--cobalto); outline-offset:2px}
h1,h2,h3,p{margin:0}
b,strong,th{font-weight:500}

.app{display:grid; grid-template-columns:308px minmax(0,1fr); min-height:100%}

/* Trilho lateral: uma aba por lead */
.trilho{background:var(--trilho); color:#E8EBF5; position:sticky; top:env(safe-area-inset-top,0px); height:100vh; display:flex; flex-direction:column; min-width:0}
.marca{padding:22px 20px 14px}
.marca b{font:600 22px/1 var(--display); letter-spacing:-.02em; display:block; margin-bottom:8px}
.marca span{font-size:12.5px; color:var(--trilho-2)}
/* Dois blocos com moldura: o menu do painel em cima e a lista de leads embaixo, em tom mais fundo e com faixa de título */
.bloco-painel{margin:0 12px 16px; border:1px solid var(--trilho-borda); border-radius:14px; background:rgba(255,255,255,.045); overflow:hidden}
.nav{display:flex; flex-direction:column; gap:2px; padding:8px}
.bloco-leads{flex:1; min-height:0; display:flex; flex-direction:column; margin:0 12px 12px; border:1px solid var(--trilho-borda); border-radius:14px; background:rgba(0,0,0,.26); overflow:hidden}
.bloco-painel .rotulo, .bloco-leads .rotulo{background:var(--trilho-faixa); color:#fff; padding:9px 14px; font-weight:500}
.bloco-leads .busca{padding:12px 10px 8px}
.bloco-leads .leads{padding:0 6px 10px}
.aba{display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; border-radius:8px; padding:8px 10px; text-align:left; cursor:pointer; color:#E8EBF5}
.aba:hover{background:var(--trilho-ativo)}
.aba[aria-current="page"]{background:var(--trilho-ativo); box-shadow:inset 3px 0 0 var(--marca)}
.nav .aba{font-weight:500; font-size:14px}
.busca{padding:12px 14px 8px}
.busca input{width:100%; background:var(--trilho-ativo); border:1px solid var(--trilho-linha); border-radius:8px; padding:8px 11px; color:#E8EBF5; font-size:13.5px}
.busca input::placeholder{color:var(--trilho-2)}
.rotulo{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--trilho-2); padding:6px 20px 4px; display:flex; justify-content:space-between}
.leads{overflow-y:auto; padding:0 10px 16px; flex:1; scrollbar-width:thin; scrollbar-color:var(--trilho-linha) transparent}
.leads .aba{align-items:flex-start; padding:7px 10px}
.pt{width:9px; height:9px; border-radius:50%; background:var(--c); flex:none; margin-top:6px}
.aba .n{font-weight:500; font-size:13.5px; line-height:1.3; display:block}
.aba .s{font-size:12px; color:var(--trilho-2); display:block}
.aba .f{margin-left:auto; font:400 12px var(--mono); color:var(--trilho-2); padding-top:2px}

/* Área principal */
.main{min-width:0; padding:34px clamp(18px,4vw,52px) 80px}
.cab{display:flex; justify-content:space-between; gap:24px; align-items:flex-end; flex-wrap:wrap; margin-bottom:22px}
.olho{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-2); margin-bottom:6px}
h1{font:600 clamp(30px,4.4vw,52px)/1 var(--display); letter-spacing:-.03em}
h2{font:600 21px/1.2 var(--display); letter-spacing:-.01em; margin-bottom:4px}
h3{font:500 12px/1.3 var(--texto); letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-2); margin-bottom:10px}
.sub{color:var(--tinta-2); margin-bottom:18px; max-width:70ch}
.meta{display:flex; gap:8px 18px; flex-wrap:wrap; color:var(--tinta-2); font-size:14px; margin-top:10px; align-items:center}
.meta a,.mono{font-family:var(--mono); font-size:13.5px}
.pill{display:inline-flex; align-items:center; gap:7px; padding:4px 11px; border-radius:20px; background:var(--folha); border:1px solid var(--linha); font-size:13px; font-weight:500; white-space:nowrap; color:var(--tinta)}
.pill::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--c)}
.nota{text-align:right}
.nota b{font:600 54px/.9 var(--display); letter-spacing:-.04em; display:block}
.nota span{font-size:12.5px; color:var(--tinta-2)}

.subabas{display:flex; gap:4px; border-bottom:1px solid var(--linha); margin-bottom:26px; overflow-x:auto}
.subabas button{background:none; border:0; border-bottom:3px solid transparent; padding:10px 14px; cursor:pointer; font-weight:500; color:var(--tinta-2); white-space:nowrap}
.subabas button[aria-selected="true"]{color:var(--tinta); border-color:var(--cobalto)}

.folha{background:var(--folha); border:1px solid var(--linha); border-radius:14px; padding:22px}
.duas{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:22px; align-items:start}
.grade{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; align-items:start}
.pilha{display:flex; flex-direction:column; gap:18px; min-width:0}
.fixa{position:sticky; top:18px}
.ficha{margin:0; display:grid; gap:14px}
.ficha dt{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-2)}
.ficha dd{margin:2px 0 0; font-weight:400; overflow-wrap:anywhere}
.ficha dd small{display:block; font-weight:400; color:var(--tinta-2); font-size:13px}
.ficha dd small.forte{color:var(--tinta); margin-bottom:6px}

/* Roteiro: a linha do tempo da ligação */
.roteiro{position:relative; padding-left:34px}
.roteiro::before{content:""; position:absolute; left:10px; top:8px; bottom:8px; width:2px; background:var(--linha)}
.etapa{position:relative; padding-bottom:28px}
.etapa:last-child{padding-bottom:0}
.etapa::before{content:attr(data-n); position:absolute; left:-34px; top:0; width:22px; height:22px; border-radius:50%; background:var(--tinta); color:var(--papel); font:400 12px/22px var(--mono); text-align:center}
.etapa h2{font-size:17px; margin-bottom:10px}
/* O que o agente diz em voz alta vem marcado como com caneta marca-texto */
.fala{font:400 18px/1.7 var(--fala); margin:0 0 8px; max-width:62ch}
.fala span{background:linear-gradient(transparent 58%,var(--marca) 58%); box-decoration-break:clone; -webkit-box-decoration-break:clone; padding:0 2px}
.obs{font-size:13.5px; color:var(--tinta-2); max-width:66ch}
.lista{margin:0; padding-left:20px; max-width:66ch}
.lista li{margin-bottom:7px}
.lista.falada li{font:400 17px/1.6 var(--fala)}
.tag{display:inline-block; font:400 11px var(--mono); letter-spacing:.02em; padding:1px 7px; border-radius:4px; background:var(--suave); color:var(--tinta-2); vertical-align:2px; margin-left:6px; text-transform:none}
.tag.dest{background:var(--cobalto); color:var(--folha)}
.oferta{border-top:1px solid var(--linha); padding:14px 0}
.oferta:first-of-type{border-top:0; padding-top:0}
.oferta .t{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; margin-bottom:6px}
.oferta .t b{font-weight:500}
.preco{font:400 13px var(--mono); color:var(--tinta-2)}
iframe.proposta{display:block; width:100%; height:82vh; margin-top:18px; border:1px solid var(--linha); border-radius:14px; background:#fff}
a.chip{text-decoration:none; color:inherit}
.acoes{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; align-items:flex-start}
.acoes .bt{display:inline-flex; align-items:center; min-height:42px; padding:0 18px; border-radius:10px; border:1px solid var(--linha); background:var(--folha); color:var(--tinta); font:500 14.5px var(--texto); text-decoration:none; cursor:pointer; list-style:none}
.acoes .bt.pri{background:var(--cobalto); border-color:var(--cobalto); color:var(--folha)}
.acoes summary::-webkit-details-marker{display:none}
.acoes details{position:relative}
.acoes details div{position:absolute; z-index:20; top:calc(100% + 6px); left:0; min-width:100%; background:var(--folha); border:1px solid var(--linha); border-radius:10px; padding:6px; box-shadow:0 10px 30px rgba(10,16,32,.14)}
.acoes details div a{display:block; padding:10px 12px; border-radius:7px; color:var(--tinta); text-decoration:none; font-weight:500; white-space:nowrap}
.acoes details div a:hover{background:var(--fundo, rgba(127,127,127,.12))}
.acoes details div small{display:block; font-weight:400; color:var(--tinta-2)}
.obj{border-top:1px solid var(--linha); padding:14px 0}
.obj:first-child{border-top:0; padding-top:0}
.obj:last-child{padding-bottom:0}
.obj>b{display:block; font-weight:500; margin-bottom:2px}
.obj .fala{font-size:17px; margin-top:8px}
details{margin-top:12px}
summary{cursor:pointer; font-weight:500; font-size:14px; color:var(--cobalto)}
details>div{margin-top:14px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:13px; padding:4px 10px; border-radius:20px; border:1px solid var(--linha); background:var(--folha)}
.chip.ok{border-color:var(--verde); color:var(--verde); font-weight:500}

/* Análise */
.lide{font:400 20px/1.55 var(--fala); max-width:60ch}
.fato{display:grid; grid-template-columns:86px 1fr; gap:12px; padding:11px 0; border-top:1px solid var(--linha)}
.fato:first-of-type{border-top:0; padding-top:0}
.fato time{font:400 12.5px var(--mono); color:var(--tinta-2); padding-top:2px}
.barras{display:grid; grid-template-columns:minmax(110px,auto) 1fr 22px; gap:7px 12px; align-items:center; font-size:13.5px}
.barras i{display:block; height:8px; border-radius:4px; background:var(--suave); overflow:hidden}
.barras i::after{content:""; display:block; height:100%; width:var(--w); background:var(--cobalto)}
.barras b{text-align:right; font:400 13px var(--mono)}
.aviso{border-left:3px solid var(--ambar); padding:2px 0 2px 14px}
.vazio{color:var(--tinta-2); font-weight:400}

/* Histórico */
.lig{border-top:1px solid var(--linha); padding:16px 0}
.lig:first-of-type{border-top:0; padding-top:0}
.lig:last-child{padding-bottom:0}
.lig .t{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline}
.lig audio{width:100%; margin-top:10px; height:38px}
.lig p{margin-top:8px}

.transc p{margin:0 0 8px; max-width:70ch}
.transc p.cliente{color:var(--tinta-2)}
.transc .mono{color:var(--tinta-2); font-size:12px}
.aval>p{margin-top:10px; max-width:70ch}
.duv{text-decoration:underline dotted var(--ambar); text-underline-offset:3px; cursor:help}

/* Gráficos */
.grade.larga{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.graf{width:100%; height:auto; display:block; overflow:visible}
.graf text{font:400 12px var(--texto); fill:var(--tinta-2)}
.graf text.forte{fill:var(--tinta); font-weight:500}
.graf .ponto{cursor:pointer}
.legenda{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color:var(--tinta-2); margin-top:10px}
.legenda span::before{content:""; display:inline-block; width:18px; height:0; border-top:2px var(--e,solid) var(--c); vertical-align:middle; margin-right:7px}
.rank{display:grid; grid-template-columns:minmax(120px,42%) 1fr 30px; gap:10px; align-items:center; padding:5px 6px; border-radius:6px; font-size:13.5px; cursor:pointer; width:100%; background:none; border:0; text-align:left}
.rank:hover{background:var(--suave)}
.rank i{display:block; height:10px; border-radius:0 4px 4px 0; background:var(--c); width:var(--w)}
.rank b{text-align:right; font:400 13px var(--mono)}
.rank.eu span{font-weight:500}
.calor td,.calor th{text-align:center; padding:9px 6px}
.calor td:first-child,.calor th:first-child{text-align:left}
.calor td.cel{font:400 13px var(--mono); border-bottom:2px solid var(--folha); border-left:2px solid var(--folha)}
.faixas{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px}
.faixas .folha>b{font:600 40px/1 var(--display); letter-spacing:-.03em}
.faixas button{display:block; background:none; border:0; padding:3px 0; cursor:pointer; text-align:left; color:var(--cobalto); font-size:14px}
#dica{position:fixed; z-index:50; pointer-events:none; background:var(--tinta); color:var(--papel); font-size:12.5px; line-height:1.4; padding:6px 9px; border-radius:6px; max-width:260px; display:none}

/* Esteiras */
/* Uma cor por etapa do kanban: vai no rótulo do cabeçalho, no filete da coluna e na borda dos cartões */
:root{--f-nova:#5F6B85; --f-tentar:#2B50FF; --f-retornar:#7A3FD1; --f-canal:#0B7F96; --f-apresentar:#C2570A; --f-aguardando:#B0288F; --f-ganha:#12855F; --f-encerrada:#C0392B}
.kcol header{background:var(--c); color:#fff; border-radius:11px 11px 0 0; margin-bottom:10px}
.kcol header h3, .kcol header small{color:#fff}
.kcol header .kn{background:rgba(255,255,255,.24); color:#fff}
.kfase{font-weight:500; font-size:14px; line-height:1.3}
.kanban{display:flex; gap:12px; overflow-x:auto; align-items:flex-start; padding-bottom:14px}
.kcol{flex:0 0 288px; background:var(--suave); border:1px solid var(--linha); border-top:3px solid var(--c); border-radius:14px; display:flex; flex-direction:column}
.kcol header{padding:12px 16px 12px}
.kcol h3{margin:0; display:flex; justify-content:space-between; align-items:center; gap:8px; text-transform:none; letter-spacing:0; font-size:13px; color:var(--tinta)}
.kn{background:var(--linha); border-radius:20px; padding:1px 8px; font:400 12px var(--mono); color:var(--tinta-2); vertical-align:middle}
.kcol header small{display:block; margin-top:6px; font:400 12.5px var(--mono); opacity:.9}
.kcards{display:flex; flex-direction:column; gap:8px; padding:4px 10px 12px; min-height:64px; border-radius:0 0 14px 14px}
.kcol.alvo .kcards{background:color-mix(in srgb, var(--c) 14%, transparent)}
.kcard{background:var(--folha); border:1px solid var(--linha); border-left:3px solid var(--c); border-radius:12px; padding:10px 12px; font-size:13px; cursor:pointer; transition:transform .12s, box-shadow .12s}
.kcard:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(28,36,52,.10)}
.kcard[draggable="true"]{cursor:grab}
.kcard b{display:block; font-weight:500; line-height:1.25}
.kcard small{display:block; color:var(--tinta-2); font-size:12px}
.krel{border-top:1px solid var(--linha); margin-top:8px; padding-top:8px; cursor:default}
.krel summary{cursor:pointer; font-size:11.5px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; color:var(--tinta-2)}
.krel textarea{display:block; width:100%; box-sizing:border-box; margin-top:8px; padding:8px 9px; border:1px solid var(--linha); border-radius:8px; background:transparent; color:inherit; font:400 12.5px/1.5 var(--texto); resize:vertical}
.krel textarea:focus{outline:2px solid var(--cobalto); outline-offset:-1px}
.kv{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-top:8px}
.kv span{font-weight:500; font-variant-numeric:tabular-nums}
.kf{display:flex; justify-content:space-between; align-items:center; gap:8px; border-top:1px solid var(--linha); margin-top:8px; padding-top:8px; font-size:11.5px; color:var(--tinta-2)}
.kvazio{border:1px dashed var(--cinza); border-radius:8px; padding:18px 8px; text-align:center; font-size:12px; color:var(--tinta-2); margin:0}
.chips button.chip, .faixa-et .chip, .kcards .chip, .selos .chip, .form-t .chip{cursor:pointer}
.selo{display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:20px; font-size:11.5px; font-weight:500; color:var(--c); background:color-mix(in srgb, var(--c) 14%, var(--folha)); white-space:nowrap}
.bateria{display:flex; height:24px; overflow:hidden; border-radius:6px}
.bateria span{min-width:3px; background:var(--c)}
.tar{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:4px 12px; padding:12px 0; border-top:1px solid var(--linha); align-items:start}
.tar:first-child{border-top:0; padding-top:0}
.tar:last-child{padding-bottom:0}
.tar b{font-weight:500}
.tar.feita b{text-decoration:line-through; color:var(--tinta-2)}
.tar .selos{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center}
.marca-t{width:20px; height:20px; margin-top:2px; border-radius:6px; border:2px solid var(--cinza); background:none; cursor:pointer; padding:0}
.marca-t[aria-pressed="true"]{background:var(--verde); border-color:var(--verde)}
.form-t{display:flex; gap:8px; flex-wrap:wrap}
.form-t input,.form-t select{background:var(--folha); border:1px solid var(--linha); border-radius:8px; padding:7px 10px}
.form-t input[name="titulo"]{flex:1 1 260px}
@media (max-width:700px){ .tar{grid-template-columns:22px minmax(0,1fr)} .tar .selos{grid-column:2; justify-content:flex-start} }
.faixa-et{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; background:var(--suave); border-radius:10px; padding:10px 14px; margin-bottom:20px; font-size:14px}
.sep-et{font:500 12px/1.3 var(--texto); letter-spacing:.06em; text-transform:uppercase; color:var(--cobalto); margin:0 0 16px -34px; padding-top:4px}
.etapa + .sep-et{margin-top:6px; padding-top:20px; border-top:1px solid var(--linha)}

/* Visão geral */
.numeros{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--linha); border:1px solid var(--linha); border-radius:14px; overflow:hidden; margin-bottom:26px}
.numeros div{background:var(--folha); padding:18px 20px}
.numeros b{font:600 30px/1 var(--display); letter-spacing:-.02em; display:block}
.numeros span{font-size:13px; color:var(--tinta-2)}
.faixa{display:grid; grid-template-columns:150px 1fr 28px; gap:12px; align-items:center; margin-bottom:9px; font-size:14px}
.faixa i{display:block; height:12px; border-radius:6px; background:var(--suave); overflow:hidden}
.faixa i::after{content:""; display:block; height:100%; width:var(--w); background:var(--c)}
.faixa b{text-align:right; font:400 14px var(--mono)}
table{width:100%; border-collapse:collapse}
.rol{overflow-x:auto}
th,td{text-align:left; padding:11px 10px; border-bottom:1px solid var(--linha); vertical-align:middle}
th{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-2); font-weight:500; white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.vai{cursor:pointer}
tr.vai:hover{background:var(--suave)}
td.num,th.num{text-align:right; font-family:var(--mono); font-size:13.5px}
td small{display:block; color:var(--tinta-2); font-size:13px}

 que a outra proposta mede em campo e o que entrega por escrito? Com esse escopo em mãos, a comparação fica na mesma base.", "proximo_passo": "Pedir o escopo atual e enviar o da Raze para comparação.", "tipo": "preço", "nao_fazer": "Não ofereça desconto nem diga que o concorrente é ruim."}, {"objecao": "A decisão é da matriz, da rede ou da administradora.", "por_tras": "Decisão fora da unidade, ou só uma forma de encerrar.", "resposta": "Entendido. Quem responde pelo sistema de energia de emergência nessa instância? Peço o nome e o canal, e menciono que a indicação partiu de você.", "proximo_passo": "Registrar o contato indicado e ligar citando a indicação.", "tipo": "redirecionamento", "nao_fazer": "Não discuta a política da empresa."}, {"objecao": "Com o laudo, a responsabilidade passa a ser de vocês?", "por_tras": "Quer saber se o laudo o protege.", "resposta": "Não, e é importante dizer com clareza. A responsabilidade pela edificação e pela operação continua com quem responde por ela. O laudo com ART vincula um engenheiro registrado ao serviço executado e documenta que a verificação foi feita por profissional habilitado: é a prova de que a gestão fez o que devia.", "proximo_passo": "Seguir para o pedido do Diagnóstico.", "tipo": "dúvida", "nao_fazer": "Não prometa transferência de risco nem de responsabilidade."}, {"objecao": "Vocês garantem que o gerador não falha?", "por_tras": "Procura uma garantia absoluta.", "resposta": "Nenhuma empresa séria garante isso. O que a Raze entrega é a medição: em quantos segundos o sistema assume, que carga sustenta e por quantas horas, com o registro de cada ensaio para comparar com o anterior. A degradação aparece antes da falha, e a decisão passa a ser tomada com número.", "proximo_passo": "Seguir para o pedido do Diagnóstico.", "tipo": "dúvida", "nao_fazer": "Não prometa resultado absoluto."}], "nao_atendeu": {"caixa_postal": "Bom dia, [Nome]. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta para medir e documentar a prontidão do gerador de [Empresa]. Retorno amanhã pela manhã.", "whatsapp": "Bom dia, [Nome]. Aqui é [Seu nome], da Raze Geradores. Conforme combinado por telefone, segue o escopo do Diagnóstico de prontidão. Para ajustar a proposta: o que o gerador de [Empresa] precisa manter ligado na falta de energia?", "email": "Assunto: Diagnóstico de prontidão do sistema de energia de emergência de [Empresa]\n\n[Nome], a Raze Geradores é uma empresa de engenharia do Rio de Janeiro dedicada à prontidão de sistemas de energia de emergência: gerador, quadro de transferência, subestação e nobreak, sob um único responsável técnico.\n\nNossa proposta para [Empresa] começa pelo Diagnóstico de prontidão: inspeção do conjunto, ensaio de partida cronometrado, verificação do que o gerador de fato alimenta e classificação de risco, com laudo, ART e reunião de leitura. É um serviço técnico com preço definido, abatido no contrato caso ele seja fechado.\n\nHá registro do último ensaio do gerador feito sob carga? Com essa informação, envio o escopo e o valor no mesmo dia."}, "cadencia": ["Até 8 contatos por conta em três semanas, somando telefone, e-mail e WhatsApp.", "Varie o horário entre as tentativas. Os dados brasileiros não mostram um horário melhor dentro do expediente; o atendimento só cai depois das 18h.", "No máximo três chamadas não atendidas por dia para o mesmo número.", "Se a recepção passou um nome, a ligação seguinte já pede essa pessoa pelo nome e cita quem indicou.", "E-mail depois da segunda tentativa sem conversa. WhatsApp só com permissão dada por telefone ou em número que a empresa divulga para contato comercial.", "Conta com data conhecida (autovistoria, Certificado de Aprovação, inspeção, assembleia, orçamento) recebe o retorno agendado com antecedência em relação a essa data.", "Depois de uma recusa clara, pausar a conta por pelo menos um mês. Depois de oito contatos sem conversa, pausar por 30 dias."], "tabulacoes": [{"nome": "Pediu proposta", "quando": "Pediu a proposta do Diagnóstico de prontidão ou de um plano e informou o que o gerador alimenta e quem cuida do sistema hoje.", "proxima_acao": "Passar à Raze no mesmo dia para envio do escopo e do valor; ligar em 2 dias úteis.", "sucesso": true}, {"nome": "Levantamento combinado", "quando": "Aceitou o Diagnóstico de prontidão ou a conversa com o engenheiro da Raze, com data marcada.", "proxima_acao": "Passar à Raze com data, contato e o que foi dito; confirmar na véspera.", "sucesso": true}, {"nome": "Compra prevista com data", "quando": "Informou a data que move a decisão: vencimento da autovistoria ou do Certificado de Aprovação, inspeção, assembleia, fechamento do orçamento ou fim do contrato atual.", "proxima_acao": "Agendar ligação com antecedência em relação à data informada.", "sucesso": true}, {"nome": "Recepção passou informação", "quando": "Saiu com nome, cargo, canal ou horário de quem responde pelo gerador.", "proxima_acao": "Ligar no horário indicado, pedindo a pessoa pelo nome.", "sucesso": false}, {"nome": "Recepção bloqueou", "quando": "Não transferiu nem passou informação.", "proxima_acao": "Tentar em outro horário; na segunda vez, pedir o e-mail da administração ou da manutenção.", "sucesso": false}, {"nome": "Indicou outro contato", "quando": "Mandou falar com outra pessoa ou empresa: administradora, síndico profissional, matriz, manutenção terceirizada.", "proxima_acao": "Ligar para o indicado citando quem indicou.", "sucesso": false}, {"nome": "Retornar em data combinada", "quando": "Pediu para ligar em outro dia ou horário.", "proxima_acao": "Ligar no horário exato.", "sucesso": false}, {"nome": "Enviar material", "quando": "Pediu e-mail sem dizer como o sistema é testado hoje.", "proxima_acao": "Enviar o escopo do Diagnóstico no mesmo dia e ligar em 2 dias úteis.", "sucesso": false}, {"nome": "Só orçamento", "quando": "Sabe o que quer e pediu preço de um serviço específico: laudo de autovistoria, ensaio com banco de cargas, prontuário NR-10, conformidade RDC 50 ou retrofit de QTA.", "proxima_acao": "Passar o pedido à Raze no mesmo dia, com o serviço, o equipamento e o prazo.", "sucesso": true}, {"nome": "Sem interesse: fornecedor atual", "quando": "Recusou por estar atendido por outro prestador ou pela equipe interna.", "proxima_acao": "Pausar; retomar em 90 dias ou no vencimento do contrato.", "sucesso": false}, {"nome": "Sem interesse: compra pela matriz", "quando": "A contratação é decidida pela matriz, pela rede, pela bandeira ou pela administradora, e não localmente.", "proxima_acao": "Pedir o contato de quem decide nessa instância; senão, encerrar.", "sucesso": false}, {"nome": "Sem interesse: sem demanda", "quando": "Não tem gerador instalado, ou não vê problema nem data que justifique a conversa.", "proxima_acao": "Pausar por 90 dias. Sem gerador, encerrar a conta.", "sucesso": false}, {"nome": "Produto fora do catálogo", "quando": "Queria algo que a Raze não faz: locação ou venda de gerador, evento, residência. Anotar o que pediu.", "proxima_acao": "Informar que a Raze não atua nessa frente e registrar o pedido para a Raze.", "sucesso": false}, {"nome": "Pessoa saiu da empresa", "quando": "O contato não trabalha mais lá, ou o síndico mudou.", "proxima_acao": "Perguntar quem assumiu e atualizar o contato.", "sucesso": false}, {"nome": "Não atendeu / caixa postal", "quando": "Sem conversa.", "proxima_acao": "Nova tentativa em outro horário.", "sucesso": false}, {"nome": "Número errado", "quando": "Telefone não é da empresa ou do condomínio.", "proxima_acao": "Corrigir o telefone na lista.", "sucesso": false}, {"nome": "Não ligar mais", "quando": "Pediu para retirar o número.", "proxima_acao": "Retirar da campanha. Não ligar de novo.", "sucesso": false}], "criterio_de_oportunidade": ["Nome e cargo de quem responde pelo sistema de energia de emergência", "Contato direto (e-mail ou telefone)", "Gerador instalado e o que ele alimenta, nas palavras do cliente", "Como o sistema é testado hoje e se há registro de ensaio sob carga", "Data que move a decisão (autovistoria, Certificado de Aprovação, inspeção, assembleia ou orçamento)", "Prestador atual de manutenção, se informado", "Aceite do Diagnóstico de prontidão ou pedido de proposta, com data do próximo passo"], "registrar": ["Com quem falou (nome e cargo)", "Se há gerador instalado e o que ele mantém ligado (elevadores, bombas, áreas críticas, câmara fria, caixas)", "Como o sistema é testado hoje e o que o cliente recebe por escrito", "Quem faz a manutenção hoje (equipe interna, zelador ou prestador) e a vigência do contrato", "Data da autovistoria, do Certificado de Aprovação, da inspeção, da assembleia ou do orçamento", "Solução apresentada", "Pedidos fora do portfólio (locação, venda, evento, residência)", "Objeção principal", "Próximo passo e data"], "recepcao": {"com_nome": "Bom dia. Gostaria de falar com [Nome], por favor. Aqui é [Seu nome], da Raze Geradores. O assunto é o sistema de energia de emergência.", "colher": ["Nome de quem responde pelo gerador e pelo sistema de energia de emergência", "Telefone direto, e-mail ou WhatsApp dessa pessoa", "Melhor horário para falar com ela", "Se há gerador instalado e se a manutenção é feita por equipe interna ou por um prestador"], "nao_fazer": "Não apresente a solução, não esconda o motivo e não finja que a pessoa está esperando a ligação."}, "triagem": {"perguntas": ["Há gerador instalado, e o que ele precisa manter ligado na falta de energia?", "A necessidade neste momento é um serviço específico, como um laudo ou um ensaio, ou a prioridade é saber se o sistema está pronto?"], "orcamento": "Se já sabe o que quer e só precisa de preço (laudo de autovistoria, ensaio com banco de cargas, prontuário NR-10, conformidade RDC 50, retrofit de QTA): registre o serviço, o equipamento e o prazo, e combine o envio da proposta pela Raze. Não diga valor.", "levantamento": "Se descreve uma dúvida ou um problema (não sabe se o gerador assume a carga, não tem registro de ensaio, tem data de vistoria ou de inspeção, troca de gestão): siga o roteiro e combine o Diagnóstico de prontidão. Se não há gerador instalado, não há oferta: a Raze não vende nem aluga equipamento."}, "ramos": [{"situacao": "O cliente retorna a ligação", "fala": "Agradeço o retorno. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Liguei para apresentar uma proposta a quem responde pelo gerador. É com você?", "depois": "Seguir do passo 3 do roteiro."}, {"situacao": "Número errado ou a pessoa saiu da empresa", "fala": "Agradeço a informação. Quem responde por essa área atualmente?", "depois": "Registrar o novo nome, ou marcar número errado."}, {"situacao": "“Fale com fulano”", "fala": "Agradeço a indicação. Qual a função dele e o melhor horário para contato? Posso mencionar que a indicação partiu de você?", "depois": "Na próxima ligação, pedir a pessoa pelo nome e citar quem indicou."}, {"situacao": "“Como conseguiu meu número?”", "fala": "É o telefone de contato divulgado pela empresa. Se preferir não receber novas ligações, retiro o número agora.", "depois": "Se pedir para retirar, marcar “Não ligar mais”. Origem dos telefones a confirmar com a Raze."}, {"situacao": "“Me liga depois”, sem data", "fala": "Combinado. Amanhã pela manhã ou quinta-feira à tarde: qual horário é melhor?", "depois": "Agendar e ligar no horário exato."}, {"situacao": "“Temos contrato com um prestador”", "fala": "Entendido. Qual a vigência do contrato? E o que ele entrega por escrito: há ensaio sob carga e autonomia medida, com registro?", "depois": "Registrar o vencimento e o que o contrato não cobre."}, {"situacao": "Pedem locação, venda de gerador ou atendimento a evento ou residência", "fala": "A Raze não vende nem aluga gerador: atua na engenharia de quem já tem o sistema instalado. Há um gerador na operação hoje? Se houver, a proposta é medir e documentar a prontidão dele.", "depois": "Sem gerador instalado, marcar “Produto fora do catálogo” e anotar o que foi pedido."}, {"situacao": "Pedem um serviço específico (laudo, ensaio, prontuário)", "fala": "Registro o pedido e a Raze envia a proposta. Para dimensionar corretamente: qual exigência ou prazo esse serviço precisa atender? E há registro do último ensaio do gerador sob carga?", "depois": "Tabular “Só orçamento” e passar à Raze no mesmo dia. Não dizer valor."}, {"situacao": "O cliente conta que o gerador falhou ou que houve autuação", "fala": "Agradeço por compartilhar. O que aconteceu exatamente, e o que foi feito desde então?", "depois": "Escutar, registrar com as palavras do cliente e propor o Diagnóstico. Não prometer que a falha não se repete."}, {"situacao": "A pessoa hesita ou fica em silêncio", "fala": "Percebo que este pode não ser o melhor momento. Prefere que eu retorne em outro horário, ou o assunto não é prioridade agora?", "depois": "Respeitar a resposta."}]}, "segmentos": {"Condomínios": {"procurar": "Síndico ou síndica. Se o prédio tem síndico profissional ou administradora, registre o nome e a empresa: são o canal de decisão. Zelador e portaria informam, não decidem; trate-os como aliados.", "alvo": "localizar quem responde pelo gerador do condomínio", "colher": ["Nome do síndico e se é morador ou síndico profissional", "Telefone direto, e-mail ou WhatsApp do síndico", "Melhor horário para falar com ele", "Nome da administradora do condomínio", "Se o prédio tem gerador e quem faz a manutenção hoje"], "central": "Bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta para quem responde pelo gerador do condomínio. Com quem trato do assunto: o síndico ou a administradora?", "abertura": "[Nome], bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta objetiva sobre o gerador do condomínio. Apresento em um minuto e você avalia se vale avançar.", "problema": "Em condomínios, o gerador costuma ser ligado toda semana, sem carga. Essa partida mostra que o motor liga; não mostra se o quadro de transferência comuta, se o gerador sustenta elevadores e bombas, nem por quantas horas. A Raze propõe medir esses pontos, com ensaio sob carga, partida cronometrada e autonomia verificada, e entregar ao síndico o laudo com ART de engenheiro registrado no CREA-RJ. O condomínio tem o registro do último ensaio do gerador feito sob carga?", "perguntas": ["O que o gerador precisa manter ligado na falta de energia: elevadores, bombas, portões, iluminação?", "Quem faz a manutenção hoje, e o que o condomínio recebe por escrito depois de cada visita?", "Quando foi a última autovistoria do prédio, e quando vence a próxima?", "A contratação de um serviço técnico pontual é decisão do síndico, ou passa pelo conselho e pela assembleia?"], "ofertas": [{"solucao": "residencial", "fala": "O plano Prontidão Residencial coloca gerador, quadro de transferência e subestação sob um único responsável técnico: visitas preventivas, ensaio sob carga e atendimento de emergência com prazo em contrato. A documentação vem dentro do contrato, e o síndico leva à assembleia um dossiê que qualquer condômino entende."}, {"solucao": "diagnostico", "fala": "O ponto de partida é o Diagnóstico de prontidão: inspeção do conjunto, ensaio de partida cronometrado e verificação do que o gerador de fato alimenta. O condomínio recebe o laudo com ART, a classificação de risco e uma reunião de leitura em linguagem acessível."}, {"solucao": "autovistoria", "fala": "Na cidade do Rio, a vistoria técnica do prédio tem intervalo máximo de cinco anos e inclui as instalações elétricas. A Raze elabora o laudo de autovistoria com ART, cobrindo o sistema elétrico e o de emergência."}], "sondar": ["Pressurização de escada ou elevador de emergência ligados ao gerador", "Subestação própria do prédio", "Nobreak da portaria, do CFTV ou do controle de acesso", "Vencimento do Certificado de Aprovação do CBMERJ", "Apresentação do laudo pelo engenheiro em assembleia"], "objecoes": [{"objecao": "O zelador liga o gerador toda semana.", "resposta": "É uma boa prática, e deve continuar. A partida sem carga mostra que o motor liga. O Diagnóstico mede o que ela não alcança: se o quadro comuta, se o gerador sustenta elevadores e bombas e por quanto tempo. O zelador acompanha o ensaio e passa a ter o número em mãos."}, {"objecao": "Isso precisa passar pela assembleia.", "resposta": "Entendido. O contrato anual costuma mesmo entrar no orçamento aprovado em assembleia. O Diagnóstico é um serviço pontual: cabe na alçada do síndico ou também depende de aprovação? Feito antes, o laudo é o documento que o síndico apresenta à assembleia."}, {"objecao": "O conselho pede três orçamentos.", "resposta": "Faz sentido. Envio o escopo detalhado do Diagnóstico, com o que é medido em campo e o que é entregue por escrito, para que o conselho compare as propostas na mesma base."}], "pedido": "Proponho o seguinte: começar pelo Diagnóstico de prontidão do sistema do condomínio. É um serviço técnico, com preço definido e abatido no contrato caso ele seja fechado. Envio hoje o escopo e o valor por escrito e retorno na quinta-feira para definirmos a data. Qual o melhor e-mail para o envio?", "plano_b": "Entendido. Quando é a próxima assembleia, e quando vence a autovistoria do prédio? Retorno antes dessa data, com o escopo do Diagnóstico preparado. Qual o melhor contato direto para falar com você?", "tecnica": {"nome": "Proposição de problema com pergunta neutra", "como": "Reconhecer a partida semanal como boa prática e mostrar o que ela não mede. A pergunta que abre é o registro do último ensaio sob carga. O Diagnóstico cabe na alçada do síndico; o dossiê é o que ele leva à assembleia. Prova de diligência, nunca transferência de responsabilidade."}}, "Administradoras de condomínios": {"procurar": "Gestor técnico ou de manutenção, gerente de condomínios ou diretor de operações da administradora. Em empresa de síndico profissional, o sócio ou o próprio síndico. É um canal: a conversa trata da carteira de prédios, não de um prédio só.", "alvo": "localizar quem responde pela área técnica ou pela gestão da carteira de condomínios", "colher": ["Nome de quem responde pela área técnica ou pela gestão dos condomínios", "Telefone direto, e-mail ou WhatsApp dessa pessoa", "Melhor horário para falar com ela", "Quantos condomínios a empresa administra e em quais bairros", "Se a contratação de manutenção é indicada pela administradora ou decidida por cada síndico"], "central": "Bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta para os condomínios da carteira que têm gerador. Com quem trato do assunto: a área técnica ou a gerência de condomínios?", "abertura": "[Nome], bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta objetiva para os condomínios da carteira que têm gerador. Apresento em um minuto e você avalia se vale avançar.", "problema": "Quem administra vários condomínios responde, na prática, por vários geradores, cada um com um prestador e um padrão de registro diferente. Quando o síndico ou o conselho pergunta se o gerador sustenta elevadores e bombas, a resposta costuma depender da palavra do técnico. A Raze propõe um padrão único para a carteira: ensaio sob carga, partida cronometrada e autonomia medida, com um dossiê por prédio. Como a administradora acompanha hoje a situação dos geradores da carteira?", "perguntas": ["Quantos condomínios da carteira têm gerador, aproximadamente?", "A manutenção desses geradores é contratada por indicação da administradora ou por decisão de cada síndico?", "Como chega à administradora o registro das manutenções, e há ensaio sob carga em algum dos prédios?", "Quais prédios têm autovistoria ou assembleia de orçamento nos próximos meses?"], "ofertas": [{"solucao": "diagnostico", "fala": "A proposta é começar por um prédio da carteira, escolhido pela administradora: o Diagnóstico de prontidão mede o sistema e entrega o laudo com ART, a classificação de risco e a reunião de leitura. A administradora avalia o padrão de entrega antes de levá-lo a outros síndicos."}, {"solucao": "residencial", "fala": "Nos prédios que seguirem para contrato, o plano Prontidão Residencial mantém gerador, quadro de transferência e subestação sob um único responsável técnico, com o mesmo padrão de relatório em toda a carteira e um dossiê por prédio, pronto para a assembleia de cada um."}, {"solucao": "autovistoria", "fala": "Para os prédios com vistoria técnica a vencer, a Raze elabora o laudo de autovistoria com ART, cobrindo o sistema elétrico e o de emergência."}], "sondar": ["Condição comercial para um lote de prédios", "Apresentação do laudo pelo engenheiro em assembleia", "Prédios com subestação própria", "Prédios com pressurização de escada ou elevador de emergência", "Condomínios comerciais ou mistos na carteira"], "objecoes": [{"objecao": "Cada síndico decide o prestador do seu prédio.", "resposta": "Entendido, e a proposta respeita essa autonomia. Qual prédio da carteira tem autovistoria ou assembleia mais próxima? Proponho começar por ele, com a apresentação ao síndico feita em conjunto com a administradora."}, {"objecao": "Já indicamos uma empresa de manutenção.", "resposta": "É natural que haja uma indicação. O Diagnóstico não substitui a manutenção: mede o sistema sob carga e documenta o resultado. O relatório que a administradora recebe hoje traz tempo de partida e autonomia medidos?"}, {"objecao": "A administradora não se envolve em contratação técnica.", "resposta": "Compreendo. Nesse caso, peço a indicação dos síndicos com vistoria ou assembleia mais próxima, e apresento a proposta diretamente a eles, mencionando a administradora apenas se você autorizar."}], "pedido": "Proponho o seguinte: escolher um prédio da carteira, de preferência o que tem a autovistoria ou a assembleia mais próxima, e realizar nele o Diagnóstico de prontidão. É um serviço técnico, com preço definido e abatido no contrato caso ele seja fechado. Envio hoje o escopo e o valor por escrito e retorno na quinta-feira para definirmos o prédio. Qual o melhor e-mail para o envio?", "plano_b": "Entendido. Quais prédios da carteira têm autovistoria ou assembleia nos próximos meses? Retorno antes dessas datas. Qual o melhor contato direto para falar com você?", "tecnica": {"nome": "Entrada por prédio piloto", "como": "Tratar a administradora como canal, não como conta: a dor é a falta de um padrão de registro na carteira. Pedir um único prédio para o Diagnóstico e deixar a expansão para depois do laudo. Sem prometer condição por lote, que ainda não está confirmada."}}, "Saúde": {"procurar": "Qualidade ou Acreditação, engenharia clínica ou manutenção hospitalar. Na falta dessas áreas, a diretoria administrativa. Evite começar por Compras.", "alvo": "localizar quem responde pela energia de emergência das áreas críticas", "colher": ["Nome de quem responde pela Qualidade e pela engenharia clínica ou manutenção", "Telefone direto, e-mail ou WhatsApp dessas pessoas", "Melhor horário para falar com elas", "Se a unidade tem centro cirúrgico, UTI, hemodiálise, imagem ou laboratório", "Se a manutenção do gerador é interna ou contratada"], "central": "Bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta sobre o registro de ensaios do gerador da unidade. Com quem trato do assunto: a Qualidade ou a engenharia clínica?", "abertura": "[Nome], bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta objetiva sobre a energia de emergência das áreas críticas da unidade. Apresento em um minuto e você avalia se vale avançar.", "problema": "Em estabelecimentos de saúde, inspeções e auditorias pedem registro do sistema de emergência: em quantos segundos o gerador assume as áreas críticas e por quantas horas sustenta a operação. Em muitas unidades, essa resposta depende da memória do técnico. A Raze propõe medir e documentar: ensaio sob carga, partida cronometrada e autonomia verificada, com histórico auditável a cada intervenção. A unidade tem hoje o registro do último ensaio sob carga e da autonomia medida?", "perguntas": ["Quais áreas críticas dependem do gerador: centro cirúrgico, UTI, hemodiálise, imagem, laboratório?", "Como são registrados hoje os testes do gerador e do quadro de transferência, e quem guarda esse histórico?", "Há inspeção sanitária, auditoria de acreditação ou obra de ampliação prevista para os próximos meses?", "Quem participa da decisão de contratar um serviço técnico como esse: Qualidade, engenharia, diretoria administrativa?"], "ofertas": [{"solucao": "hospitalar", "fala": "O plano Prontidão Hospitalar coloca gerador, quadro de transferência e nobreak sob um único responsável técnico, com ensaio com banco de cargas, autonomia verificada e histórico auditável a cada intervenção. A Qualidade passa a ter a evidência pronta para a inspeção e para a acreditação, e um canal direto com o responsável técnico."}, {"solucao": "diagnostico", "fala": "O ponto de partida é o Diagnóstico de prontidão: inspeção do conjunto, ensaio de partida cronometrado e verificação do que o gerador de fato alimenta nas áreas críticas. A unidade recebe o laudo com ART, a classificação de risco e a reunião de leitura."}, {"solucao": "rdc50", "fala": "Para a frente regulatória, a Raze verifica o sistema de emergência frente às classes de comutação e autonomia da RDC 50 e entrega o registro auditável do que foi medido. O engenheiro confirma no local o que se aplica a cada área."}], "sondar": ["Nobreak das áreas com equipamentos de suporte à vida", "Subestação própria da unidade", "Prontuário de Instalações Elétricas (NR-10)", "Outras unidades da rede na região metropolitana", "Checklist de conformidade elétrica para a Qualidade"], "objecoes": [{"objecao": "Já temos contrato de manutenção.", "resposta": "É esperado que haja. A questão que a proposta endereça é o registro: há hoje o resultado do último ensaio sob carga e da autonomia medida? Se a resposta exigir busca, o Diagnóstico organiza essa evidência sem interferir no contrato atual."}, {"objecao": "Isso é com a manutenção, não com a Qualidade.", "resposta": "Entendido. A execução envolve a manutenção, e o registro interessa à Qualidade na inspeção e na auditoria. Quem responde pela manutenção? Proponho apresentar a proposta aos dois, em conjunto."}, {"objecao": "Passamos na última inspeção.", "resposta": "Ótimo. A proposta não parte de um problema na inspeção: parte do registro. Para a próxima, o histórico de ensaios sob carga está organizado e disponível?"}], "pedido": "Proponho o seguinte: começar pelo Diagnóstico de prontidão do sistema de emergência da unidade. É um serviço técnico, com preço definido e abatido no contrato caso ele seja fechado, e o laudo fica como evidência para a inspeção e a auditoria. Envio hoje o escopo e o valor por escrito e retorno na quinta-feira para definirmos a data com a engenharia. Qual o melhor e-mail para o envio?", "plano_b": "Entendido. Quando está prevista a próxima inspeção ou auditoria, e quando a unidade fecha o orçamento do próximo ano? Retorno antes dessa data. Qual o seu e-mail direto?", "tecnica": {"nome": "Entrada pela Qualidade, com pergunta de registro", "como": "Abrir pelo registro que a inspeção e a auditoria pedem, não pela manutenção. A pergunta que qualifica é se há registro do último ensaio sob carga e da autonomia medida. Mapear quem participa da decisão e evitar Compras na primeira conversa."}}, "Supermercados e cadeia fria": {"procurar": "Gerente de manutenção ou de utilidades; na falta, gerente de operações ou de loja. Em rede, a manutenção ou a engenharia corporativa. Evite começar por Compras ou Suprimentos.", "alvo": "localizar quem responde pela manutenção do gerador e da refrigeração", "colher": ["Nome de quem responde pela manutenção ou pelas utilidades", "Telefone direto, e-mail ou WhatsApp dessa pessoa", "Melhor horário para falar com ela", "Se a operação tem câmara fria e gerador instalado", "Se a manutenção é decidida na unidade ou pela rede"], "central": "Bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta para quem responde pelo gerador e pelas câmaras frias da operação. Com quem trato do assunto: a manutenção ou a gerência de operações?", "abertura": "[Nome], bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta objetiva sobre o gerador que sustenta a refrigeração da operação. Apresento em um minuto e você avalia se vale avançar.", "problema": "Em operações com câmara fria, é comum o gerador ter sido dimensionado para a carga de anos atrás, sem considerar a partida dos compressores. No teste sem carga ele liga normalmente; a dúvida é se assume a refrigeração inteira e por quantas horas mantém a temperatura. A Raze propõe medir: carga real contra capacidade instalada, partida sob carga e autonomia da câmara fria. Quando foi a última vez que o gerador assumiu a refrigeração completa em um ensaio?", "perguntas": ["O que o gerador sustenta hoje: câmaras frias, balcões refrigerados, caixas, iluminação?", "Houve aumento de carga desde a instalação do gerador, como câmara nova ou ampliação?", "Qual é o custo de uma hora de operação parada ou de perda de perecíveis?", "Quando a empresa fecha o orçamento de manutenção do próximo ano, e quem aprova?"], "ofertas": [{"solucao": "industrial", "fala": "O plano Prontidão Industrial compara a carga real com a capacidade do gerador, testa a partida sob carga e verifica a autonomia da câmara fria, com ensaio com banco de cargas e relatório de indicadores. A manutenção passa a ter o número que justifica o orçamento e o registro que a auditoria pede."}, {"solucao": "diagnostico", "fala": "O ponto de partida é o Diagnóstico de prontidão: inspeção do conjunto, ensaio de partida cronometrado e verificação do que o gerador de fato alimenta. A operação recebe o laudo com ART e a classificação de risco, com reunião de leitura."}, {"solucao": "comercial", "fala": "Para lojas sem estrutura própria de manutenção, o plano Prontidão Comercial acompanha gerador e quadro de transferência com visita preventiva, ensaio de partida e atendimento de emergência com resposta definida em contrato."}], "sondar": ["Subestação própria e Prontuário de Instalações Elétricas (NR-10)", "Nobreak dos caixas e dos servidores", "Retrofit do quadro de transferência", "Outras lojas ou centros de distribuição na região metropolitana", "Laudo de autovistoria do prédio"], "objecoes": [{"objecao": "Nossa manutenção interna cuida disso.", "resposta": "Ótimo, isso facilita o trabalho. A equipe interna mantém o equipamento; o ensaio com banco de cargas é complementar: carga real aplicada em degraus, com tensão, frequência, corrente e temperatura registradas em cada patamar. A equipe dispõe hoje de banco de cargas para esse ensaio?"}, {"objecao": "Chamamos alguém quando dá problema.", "resposta": "Entendido. Nesse modelo, o atendimento começa depois que a refrigeração já ficou sem energia. A proposta é saber antes o que o gerador sustenta. Qual é o custo de uma hora de câmara fria sem energia?"}, {"objecao": "O gerador é novo.", "resposta": "Bom ponto de partida. Equipamento novo também precisa do registro inicial: partida, carga assumida e autonomia medidas. É a referência com a qual os ensaios seguintes serão comparados. Esse registro foi feito na entrega?"}], "pedido": "Proponho o seguinte: começar pelo Diagnóstico de prontidão, com a verificação do que o gerador de fato sustenta na refrigeração. É um serviço técnico, com preço definido e abatido no contrato caso ele seja fechado. Envio hoje o escopo e o valor por escrito e retorno na quinta-feira para definirmos a data. Qual o melhor e-mail para o envio?", "plano_b": "Entendido. Quando a empresa fecha o orçamento de manutenção do próximo ano, e há parada programada prevista? Retorno antes dessa data, com o escopo preparado. Qual o seu e-mail direto?", "tecnica": {"nome": "Pergunta de impacto em valor", "como": "Venda aritmética, sem apelo emocional: dimensionamento contra a carga atual e o custo da hora parada, dito pelo próprio cliente. Falar com a manutenção antes de Compras. Não citar norma de vigilância sanitária: a vigência da portaria municipal não está confirmada."}}, "Comércio e centros comerciais": {"procurar": "Gerente de operações ou de facilities; em centro comercial ou galeria, a administração do empreendimento; em comércio de menor porte, o sócio ou proprietário.", "alvo": "localizar quem responde pelo gerador e pela manutenção predial", "colher": ["Nome de quem responde pela operação ou pela manutenção predial", "Telefone direto, e-mail ou WhatsApp dessa pessoa", "Melhor horário para falar com ela", "Se o gerador é do empreendimento ou de cada loja", "Quem faz a manutenção hoje"], "central": "Bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta para quem responde pelo gerador e pela manutenção predial. Com quem trato do assunto: a gerência de operações ou a administração?", "abertura": "[Nome], bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta objetiva sobre o gerador do empreendimento. Apresento em um minuto e você avalia se vale avançar.", "problema": "Em lojas e centros comerciais, o gerador existe para manter a operação aberta: caixas, elevadores, escadas rolantes, climatização e sistemas de segurança. O teste de rotina mostra que o motor liga; não mostra o que ele sustenta com o empreendimento em funcionamento, nem por quanto tempo. A Raze propõe medir e documentar esses pontos, com laudo e ART. Como o empreendimento verifica hoje o que o gerador mantém ligado?", "perguntas": ["O que o gerador precisa manter em funcionamento: caixas, elevadores, escadas rolantes, climatização, sistemas de incêndio?", "Quem faz a manutenção hoje, e o que o empreendimento recebe por escrito depois de cada visita?", "Quando vencem a autovistoria do prédio e o Certificado de Aprovação do CBMERJ?", "Há exigência de seguradora, de locatário ou da administração sobre o sistema de emergência?"], "ofertas": [{"solucao": "comercial", "fala": "O plano Prontidão Comercial acompanha gerador e quadro de transferência com visita preventiva, ensaio de partida e atendimento de emergência com resposta definida em contrato. A operação passa a ter o registro de cada verificação e a documentação técnica do sistema em dia."}, {"solucao": "diagnostico", "fala": "O ponto de partida é o Diagnóstico de prontidão: inspeção do conjunto, ensaio de partida cronometrado e verificação do que o gerador de fato alimenta. O empreendimento recebe o laudo com ART, a classificação de risco e a reunião de leitura."}, {"solucao": "autovistoria", "fala": "Para o prédio, a Raze elabora o laudo de autovistoria com ART, cobrindo o sistema elétrico e o de emergência. Na cidade do Rio, a vistoria técnica tem intervalo máximo de cinco anos."}], "sondar": ["Subestação própria e Prontuário de Instalações Elétricas (NR-10)", "Nobreak dos caixas, dos servidores e do CFTV", "Retrofit do quadro de transferência", "Outras unidades da rede na região metropolitana", "Câmara fria ou praça de alimentação ligadas ao gerador"], "objecoes": [{"objecao": "Chamamos alguém quando dá problema.", "resposta": "Entendido. Nesse modelo, o atendimento começa depois que a operação já parou. A proposta é saber antes o que o gerador sustenta. O que acontece com a operação quando a energia falta em horário de movimento?"}, {"objecao": "O gerador é do condomínio ou do shopping.", "resposta": "Agradeço a informação. Quem responde pela administração do empreendimento? Peço o nome e o canal para apresentar a proposta a quem cuida do gerador."}, {"objecao": "Quase não falta energia aqui.", "resposta": "É um bom cenário. Justamente por operar pouco, o gerador tem menos oportunidades de mostrar como responde com carga. Há registro de algum ensaio sob carga?"}], "pedido": "Proponho o seguinte: começar pelo Diagnóstico de prontidão do sistema do empreendimento. É um serviço técnico, com preço definido e abatido no contrato caso ele seja fechado. Envio hoje o escopo e o valor por escrito e retorno na quinta-feira para definirmos a data. Qual o melhor e-mail para o envio?", "plano_b": "Entendido. Quando vencem a autovistoria e o Certificado de Aprovação, e quando a empresa fecha o orçamento do próximo ano? Retorno antes dessa data. Qual o melhor contato direto para falar com você?", "tecnica": {"nome": "Proposição de problema com data de conformidade", "como": "Abrir pelo que o gerador precisa manter em funcionamento e perguntar como isso é verificado. As datas da autovistoria e do Certificado de Aprovação dão o prazo da conversa. Confirmar cedo se o gerador é da loja ou do empreendimento."}}, "Postos de combustível": {"procurar": "Proprietário ou sócio; em posto de rede, o gerente operacional ou a área de manutenção da rede. Em posto independente, quem atende costuma estar próximo de quem decide.", "alvo": "localizar quem decide a manutenção do gerador do posto", "colher": ["Nome de quem decide a manutenção (proprietário, sócio ou gerente)", "Telefone direto, e-mail ou WhatsApp dessa pessoa", "Melhor horário para falar com ela", "Se o posto tem gerador instalado", "Se o posto é independente ou de rede, e quantas unidades há"], "central": "Bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta para quem responde pelo gerador do posto. Com quem trato do assunto: o proprietário ou a gerência?", "abertura": "[Nome], bom dia. Aqui é [Seu nome], da Raze Geradores, engenharia de prontidão de sistemas de energia de emergência. Tenho uma proposta objetiva sobre o gerador do posto. Apresento em um minuto e você avalia se vale avançar.", "problema": "Em posto de combustível, sem energia a bomba não abastece e o caixa não registra: a venda daquele período não se recupera. Onde há gerador, o teste de rotina mostra que ele liga; não mostra se assume bombas, caixa e loja de conveniência ao mesmo tempo, nem por quantas horas. A Raze propõe medir esses pontos e documentá-los, com laudo e ART. O gerador do posto já foi testado assumindo a operação inteira?", "perguntas": ["O posto tem gerador, e o que ele mantém em funcionamento: bombas, caixa, loja de conveniência, iluminação?", "Quem faz a manutenção do gerador hoje, e com que frequência?", "Quanto representa, em vendas, uma hora de posto sem energia?", "A decisão é do posto ou passa pela rede?"], "ofertas": [{"solucao": "comercial", "fala": "O plano Prontidão Comercial acompanha gerador e quadro de transferência com visita preventiva, ensaio de partida e atendimento de emergência com resposta definida em contrato. O posto passa a ter o registro de cada verificação e sabe o que o gerador sustenta."}, {"solucao": "diagnostico", "fala": "O ponto de partida é o Diagnóstico de prontidão: inspeção do conjunto, ensaio de partida cronometrado e verificação do que o gerador de fato alimenta. O posto recebe o laudo com ART e a classificação de risco, com reunião de leitura."}], "sondar": ["Nobreak da automação e do caixa", "Câmara fria ou refrigeração da loja de conveniência", "Outros postos da rede na região metropolitana", "Documentação das instalações elétricas do posto", "Posto sem gerador com interesse em instalar (a Raze não vende equipamento)"], "objecoes": [{"objecao": "O posto não tem gerador.", "resposta": "Agradeço a informação. A Raze não vende nem aluga gerador: atua na engenharia de quem já tem o sistema instalado. Outras unidades da rede têm gerador?"}, {"objecao": "Quase não falta energia aqui.", "resposta": "É um bom cenário. Justamente por operar pouco, o gerador tem menos oportunidades de mostrar como responde com carga. Quanto representa, em vendas, uma hora de posto parado?"}, {"objecao": "A bandeira ou a rede cuida disso.", "resposta": "Entendido. Quem responde pela manutenção na rede? Peço o nome e o canal, e menciono que a indicação partiu de você."}], "pedido": "Proponho o seguinte: começar pelo Diagnóstico de prontidão do gerador do posto. É um serviço técnico, com preço definido e abatido no contrato caso ele seja fechado. Envio hoje o escopo e o valor por escrito e retorno na quinta-feira para definirmos a data. Qual o melhor e-mail ou WhatsApp para o envio?", "plano_b": "Entendido. Quando o posto costuma rever os contratos de manutenção? Retorno antes dessa data. Qual o melhor contato direto para falar com você?", "tecnica": {"nome": "Receita da hora parada", "como": "A conversa é de venda perdida, nunca de norma: não há obrigação legal de gerador em posto. Confirmar primeiro se há gerador instalado; sem gerador, não há oferta. O plano indicado é hipótese até a Raze confirmar."}}}, "solucoes": {"diagnostico": {"nome": "Diagnóstico de prontidão", "resolve": "O gestor passa a saber, com número medido, o que o sistema de emergência de fato sustenta: se o gerador assume a carga, em quantos segundos e o que fica ligado. Sai com o laudo, a classificação de risco e a leitura em linguagem acessível.", "composicao": ["Inspeção de gerador, quadro de transferência (QTA) e subestação", "Ensaio de partida cronometrado", "Verificação de abrangência real: o que o gerador de fato alimenta", "Laudo com ART e registro fotográfico", "Classificação de risco", "Reunião de leitura acessível"], "referencia": "Preço definido e abatido no contrato caso ele seja fechado; valor a confirmar com a Raze. É a porta de entrada de todo contrato.", "chaves": ["diagnóstico       <dl class="ficha" style="margin-top:14px">
      ${campo("Segmento", esc(c.segmento))}
      ${campo("Porte", esc(c.porte))}
      ${campo("Plano de entrada", esc(entrada(c).nome))}
      ${campo("Por que abordar", esc(c.angulo))}
      ${campo("Pergunta de abertura", esc(c.gancho))}
      </dl><p class="obs" style="margin-top:12px">${esc(c.sinal)}</p></div></div>`;

        <div><dt>Onde opera</dt><dd>${a.onde_opera?esc(a.onde_opera):`<span class="vazio">não encontrado</span>`}</dd></div>

      </dl></div>
      ${bi}
    </div>
  </div>`;
}

const TIPO = {decisor:"falou com quem decide", recepcao:"só recepção", caixa_postal:"caixa postal", retorno:"retorno do cliente", numero_errado:"número errado", outro:"sem conversa"};
const CRM = {falou_com:"Falou com", quem_decide:"Quem decide", problema_declarado:"Problema declarado", solucao_apresentada:"Solução apresentada", quantidade_e_prazo:"Quantidade e prazo", pedido_fora_do_catalogo:"Pedido fora do catálogo", fornecedor_atual:"Fornecedor atual", objecao_principal:"Objeção principal", proximo_passo:"Próximo passo"};
const corNota = n => n==null ? "--cinza" : n>=70 ? "--verde" : n>=40 ? "--ambar" : "--vermelho";
const mmss = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(Math.floor(s%60)).padStart(2,"0")}`;

function conversaHtml(v){

  return `<div class="aval">

    <p>${esc(a.resumo)}</p>${medidas}
    ${(a.promessas_fora_do_catalogo||[]).filter(Boolean).length?`<p class="aviso" style="margin-top:12px"><b>Prometido fora do catálogo:</b> ${a.promessas_fora_do_catalogo.filter(Boolean).map(esc).join("; ")}</p>`:""}
    ${(a.melhorias||[]).length?`<h3 style="margin-top:18px">O que mudar na próxima</h3>${a.melhorias.map(x=>`<div class="obj"><b>${esc(x.o_que)}</b>${fala(x.fala_sugerida)}</div>`).join("")}`:""}
    <details><summary>Nota por critério</summary><div><table>${a.criterios.map(c=>`<tr><td style="width:44px"><b class="mono" style="color:var(${c.nota==null?"--cinza":corNota(c.nota/3*100)})">${c.nota==null?"n/a":c.nota+"/3"}</b></td><td><b>${esc(c.nome)}</b><small>${esc(c.comentario||"")}</small>${c.trecho?`<small style="font-family:var(--fala); font-size:14px">“${esc(c.trecho)}”</small>`:""}</td></tr>`).join("")}</table></div></details>

/* ===== BI: gráficos em SVG. Uma cor de destaque para a conta em foco; cinza para o contexto. ===== */
const CURTO = ["Computadores","Upgrade","Energia","CFTV","Periféricos","Rede"];
const um = v => v.toFixed(1).replace(".",",");
const media = a => a.reduce((s,x)=>s+x,0)/(a.length||1);
const mediaAder = c => media(c.ader);
const doSegmento = s => C.filter(c=>c.segmento===s);
const perfilMedio = lista => DB.eixos.map((_,i)=>media(lista.map(c=>c.ader[i])));
/* Faixa de prioridade: regra simples, sobre o fit do plano e a confiança da pesquisa */
function faixa(c){
  const a = c.analise;
  // Conta sem pesquisa individual não chega à faixa A
  if (!a) return nota(c)<=6 ? "C" : "B";
  if (a?.confianca==="baixa" || a?.identidade_confirmada===false || nota(c)<=6) return "C";
  return nota(c)>=9 ? "A" : "B";
}
const FAIXA = {A:"Fit 9 ou mais e empresa confirmada: preparo completo, ligar primeiro.", B:"Fit 7 ou 8: roteiro do segmento com o fato da conta.", C:"Fit até 6, pouca informação pública ou identidade não confirmada: ligar por último ou tirar da rodada. Contas sem pesquisa individual ficam em B ou C."};

function radar(c){
  const W=360, H=300, cx=W/2, cy=H/2+2, R=104, n=DB.eixos.length, seg=perfilMedio(doSegmento(c.segmento));
  const pt = (i,v) => { const a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*R*v/10, cy+Math.sin(a)*R*v/10] };
  const poli = vals => vals.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(",")).join(" ");
  return `<svg class="graf" style="max-width:420px; margin:0 auto" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aderência de ${esc(c.empresa)} por tipo de produto, comparada à média do segmento">
    ${[2,4,6,8,10].map(v=>`<polygon points="${poli(Array(n).fill(v))}" fill="none" stroke="var(--linha)"/>`).join("")}
    ${DB.eixos.map((e,i)=>{ const [x,y]=pt(i,10), [lx,ly]=pt(i,12.2); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--linha)"/><text class="forte" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end"}" dominant-baseline="middle">${CURTO[i]}</text>` }).join("")}
    <polygon points="${poli(seg)}" fill="none" stroke="var(--cinza)" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="${poli(c.ader)}" fill="var(--cobalto)" fill-opacity=".14" stroke="var(--cobalto)" stroke-width="2" stroke-linejoin="round"/>
    ${c.ader.map((v,i)=>{ const [x,y]=pt(i,v); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--cobalto)" stroke="var(--folha)" stroke-width="2"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="transparent" data-tip="${esc(DB.eixos[i])}: ${v} de 10. Média do segmento: ${um(seg[i])}."/>` }).join("")}
  </svg>
  <div class="legenda"><span style="--c:var(--cobalto)">${esc(c.empresa)}</span><span style="--c:var(--cinza); --e:dashed">Média de ${esc(c.segmento)}</span></div>`;
}

/* Todas as contas: fit do plano (x) contra aderência média (y). foco = id em destaque; seg = segmento em destaque. */
function dispersao(foco, seg){
  const W=620, H=320, m={l:46,r:16,t:14,b:42};
  const xs=C.map(nota), ys=C.map(mediaAder);
  const x0=Math.min(...xs)-1, x1=12, y0=Math.floor(Math.min(...ys))-0.5, y1=Math.ceil(Math.max(...ys))+0.5;
  const X = v => m.l+(v-x0)/(x1-x0)*(W-m.l-m.r), Y = v => H-m.b-(v-y0)/(y1-y0)*(H-m.t-m.b);
  const ticksX=[]; for (let v=Math.ceil(x0); v<=x1; v++) ticksX.push(v);
  const ticksY=[]; for (let v=Math.ceil(y0); v<=y1; v++) ticksY.push(v);
  const emFoco = c => c.id===foco || (seg && c.segmento===seg);
  // Contas com o mesmo par de valores caem no mesmo ponto: um pequeno desvio fixo separa as bolinhas
  const pos = new Map(); const desvio = c => { const k=nota(c)+"|"+um(mediaAder(c)), n=pos.get(k)||0; pos.set(k,n+1); return [((n%3)-1)*11, -Math.floor(n/3)*11] };
  const pts = [...C].sort((a,b)=>emFoco(a)-emFoco(b)).map(c=>{ const [dx,dy]=desvio(c), px=X(nota(c))+dx, py=Y(mediaAder(c))+dy, f=emFoco(c);
    return `<g class="ponto" data-ir="lead/${c.id}/bi" data-tip="${esc(c.empresa)} · ${esc(c.segmento)}. Fit ${nota(c)}/12, aderência média ${um(mediaAder(c))}. Faixa ${faixa(c)}.">
      <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${c.id===foco?8:6}" fill="var(${f?"--cobalto":"--cinza"})" fill-opacity="${f?1:.55}" stroke="var(--folha)" stroke-width="2"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="13" fill="transparent"/>
      ${c.id===foco?`<text class="forte" x="${(px+(px>W*0.6?-12:12)).toFixed(1)}" y="${(py+4).toFixed(1)}" text-anchor="${px>W*0.6?"end":"start"}" paint-order="stroke" stroke="var(--folha)" stroke-width="4">${esc(c.empresa)}</text>`:""}</g>` }).join("");
  return `<svg class="graf" style="max-width:760px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Contas por fit e aderência média">
    ${ticksY.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--linha)"/><text x="${m.l-8}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`).join("")}
    ${ticksX.map(v=>`<text x="${X(v).toFixed(1)}" y="${H-m.b+18}" text-anchor="middle">${v}</text>`).join("")}
    <line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="var(--cinza)"/>
    <text x="${(m.l+W-m.r)/2}" y="${H-6}" text-anchor="middle">Fit da conta, de 0 a 12</text>
    <text transform="translate(13 ${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle">Aderência média, de 0 a 10</text>
    ${pts}</svg>`;
}

function bi(c){
  const seg = doSegmento(c.segmento).sort((a,b)=>nota(b)-nota(a) || a.empresa.localeCompare(b.empresa));
  const posicao = ordenadasPorFit.findIndex(x=>x.id===c.id)+1, e = entrada(c), f = faixa(c);
  const melhor = c.ader.indexOf(Math.max(...c.ader));
  return `<div class="numeros">${[[f,"faixa de prioridade"],[`${posicao}º`,`em fit, de ${C.length} contas`],[`${seg.findIndex(x=>x.id===c.id)+1}º`,`de ${seg.length} em ${esc(c.segmento)}`],[c.ader[melhor],`aderência a ${esc(DB.eixos[melhor])}, a mais alta`]].map(([n,t])=>`<div><b>${n}</b><span>${t}</span></div>`).join("")}</div>
  <p class="sub">${FAIXA[f]} Solução de entrada: ${esc(e.nome)}.</p>
  <div class="grade larga">
    <div class="folha"><h3>Aderência por tipo de produto</h3>${radar(c)}
      <details><summary>Ver em números</summary><div><div class="barras">${DB.eixos.map((x,i)=>`<span>${esc(x)}</span><i style="--w:${c.ader[i]*10}%"></i><b>${c.ader[i]}</b>`).join("")}</div></div></details></div>
    <div class="folha"><h3>Onde esta conta está na carteira</h3>${dispersao(c.id)}<p class="obs" style="margin-top:8px">Cada ponto é uma conta. Quanto mais à direita e acima, melhor o encaixe. Clique num ponto para abrir a conta.</p></div>
    <div class="folha"><h3>Por que esta conta (fit ${nota(c)} de 12)</h3><div class="barras">${FIT.map((x,i)=>`<span>${x}</span><i style="--w:${c.fit[i]/3*100}%"></i><b>${c.fit[i]}</b>`).join("")}</div><p class="obs" style="margin-top:10px">Cada critério vale de 0 a 3.</p></div>
    <div class="folha"><h3>Contas de ${esc(c.segmento)}, por fit</h3>${seg.map(x=>`<button class="rank ${x.id===c.id?"eu":""}" data-ir="lead/${x.id}/bi" style="--c:var(${x.id===c.id?"--cobalto":"--cinza"}); --w:${nota(x)/12*100}%"><span>${esc(x.empresa)}</span><i></i><b>${nota(x)}</b></button>`).join("")}</div>
  </div>`;
}

let segFoco = "";
function segmentacao(){
  const segs = [...new Set(C.map(c=>c.segmento))].map(s=>{ const l=doSegmento(s); return {s, l, fit:media(l.map(nota)), perfil:perfilMedio(l), abord:l.filter(c=>c.sit!=="pendente").length, sol:P.solucoes[P.segmentos[s]?.ofertas[0]?.solucao]?.nome||""} }).sort((a,b)=>b.l.length-a.l.length || b.fit-a.fit);
  const porFaixa = k => C.filter(c=>faixa(c)===k).sort((a,b)=>nota(b)-nota(a));
  return `
  <div class="cab"><div><div class="olho">Como a carteira se divide</div><h1>Segmentação</h1></div></div>
  <section><h2>Prioridade de ligação</h2><p class="sub">Três faixas, calculadas do fit do plano e da confiança da pesquisa de cada empresa.</p>
    <div class="faixas">${["A","B","C"].map(k=>`<div class="folha"><h3>Faixa ${k}</h3><b>${porFaixa(k).length}</b><p class="obs" style="margin:8px 0 10px">${FAIXA[k]}</p>${porFaixa(k).map(c=>`<button data-ir="lead/${c.id}/bi">${esc(c.empresa)} <span class="mono" style="color:var(--tinta-2)">${nota(c)}</span></button>`).join("")}</div>`).join("")}</div></section>
  <section><h2>Segmentos</h2><p class="sub">Quantas contas em cada segmento, o encaixe médio, por qual solução entrar e como está o andamento.</p>
    <div class="folha rol"><table><thead><tr><th>Segmento</th><th class="num">Contas</th><th class="num">Fit médio</th><th>Solução de entrada</th><th class="num">Ligadas</th><th class="num">Conversou</th></tr></thead><tbody>
    ${segs.map(g=>`<tr class="vai" data-seg="${esc(g.s)}" tabindex="0"><td><b>${esc(g.s)}</b></td><td class="num">${g.l.length}</td><td class="num">${um(g.fit)}/12</td><td>${esc(g.sol)}</td><td class="num">${g.abord}</td><td class="num">${g.l.filter(c=>c.sit==="conversou").length}</td></tr>`).join("")}</tbody></table></div></section>
  <section><h2>Aderência por segmento e tipo de produto</h2><p class="sub">Média de 0 a 10. Quanto mais escuro, mais o segmento precisa daquele tipo de produto.</p>
    <div class="folha rol"><table class="calor"><thead><tr><th>Segmento</th>${CURTO.map(e=>`<th>${e}</th>`).join("")}</tr></thead><tbody>
    ${segs.map(g=>`<tr><td><b>${esc(g.s)}</b></td>${g.perfil.map((v,i)=>`<td class="cel" data-tip="${esc(g.s)}, ${esc(DB.eixos[i])}: ${um(v)} de 10 (${g.l.length} contas)" style="background:color-mix(in srgb, var(--cobalto) ${Math.round(v*9)}%, var(--folha)); color:var(${v>=6.5?"--folha":"--tinta"})">${um(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
  <section><h2>Mapa das contas</h2><p class="sub">Fit contra aderência média. Escolha um segmento para destacar as contas dele.</p>
    <div class="chips" style="margin-bottom:14px"><button class="chip ${segFoco?"":"ok"}" data-seg="">Todas</button>${segs.map(g=>`<button class="chip ${segFoco===g.s?"ok":""}" data-seg="${esc(g.s)}">${esc(g.s)} (${g.l.length})</button>`).join("")}</div>
    <div class="folha" id="mapa">${dispersao(null, segFoco)}</div></section>`;
}

function ligHtml(x){
